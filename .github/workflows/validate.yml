name: Validate catalog

on:
  push:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test fixed card artwork canvas
        run: python3 scripts/test_validate_catalog.py
      - name: Validate schema, artwork and version
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          BASE_FILE=/tmp/base-catalog.json
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=HEAD^
          fi
          if git cat-file -e "$BASE_REF:docs/catalog.json" 2>/dev/null; then
            git show "$BASE_REF:docs/catalog.json" > "$BASE_FILE"
            if cmp -s docs/catalog.json "$BASE_FILE"; then
              python3 scripts/validate_catalog.py docs/catalog.json
            else
              python3 scripts/validate_catalog.py docs/catalog.json --base "$BASE_FILE"
            fi
          else
            python3 scripts/validate_catalog.py docs/catalog.json
          fi
