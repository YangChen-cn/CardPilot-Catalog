name: Validate catalog

on:
  push:
    paths: ["docs/catalog.json", "scripts/validate_catalog.py"]
  pull_request:
    paths: ["docs/catalog.json", "scripts/validate_catalog.py"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_catalog.py docs/catalog.json
