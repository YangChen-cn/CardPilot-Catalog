name: Validate catalog

on:
  push:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test fixed card artwork canvas
        run: python3 scripts/test_validate_catalog.py
      - name: Validate schema, artwork and version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_FILE=/tmp/base-catalog.json
          # A feature branch may amend the same unpublished catalog version
          # across several commits. Compare it with main, not its previous commit.
          # On main, every published change must increment from the prior commit.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_REF="origin/$BASE_BRANCH"
          elif [ "$REF_NAME" != "main" ]; then
            BASE_REF="origin/main"
          else
            BASE_REF="$BEFORE_SHA"
          fi
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=HEAD^
          fi
          if git cat-file -e "$BASE_REF:docs/catalog.json" 2>/dev/null; then
            git show "$BASE_REF:docs/catalog.json" > "$BASE_FILE"
            if cmp -s docs/catalog.json "$BASE_FILE"; then
              python3 scripts/validate_catalog.py docs/catalog.json
            else
              python3 scripts/validate_catalog.py docs/catalog.json --base "$BASE_FILE"
            fi
          else
            python3 scripts/validate_catalog.py docs/catalog.json
          fi
